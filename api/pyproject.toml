[project]
name = "dju_api_12"
version = "0.1.0"
description = "API de calcul des degrés-jours unifiés (projet ENSAI 2A)"
authors = [{ name = "Yousfi Aziz" }, { name = "Sterlin Eudes" }, { name = "Dahan Gabriel" }, { name = "Lassalle Gwenael" }, { name = "Feral Marceau" }]
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "psycopg2-binary",
    "python-dotenv",
    "bcrypt",
    "pyjwt",
    "pandas",
    "numpy",
]

# Outils de développement
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "coverage"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" } # code source dans src

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
python_files = ["*test*.py"]
addopts = "-v -s -x"

[tool.coverage.run]
branch = true
include = ["src/service/*", "src/dao/*"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage_report"